# Publishes pages/ (the page the phone opens from the NFC tag) on GitHub Pages:
# https://fedepaj.github.io/fortunino/. Only that folder is uploaded; the submodules are private
# and not needed, so they are not checked out.
name: pages

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
